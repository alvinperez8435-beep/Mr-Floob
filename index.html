<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🦕 Mr Floob</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    border-radius: 12px;
    border: 2px solid #1a2a1a;
    box-shadow: 0 0 40px #00ff6622;
  }
  #controls {
    display: grid;
    grid-template-columns: 70px 70px 70px;
    grid-template-rows: 70px 70px;
    gap: 8px;
    margin-top: 18px;
  }
  .btn {
    background: #111a11;
    border: 2px solid #2a4a2a;
    border-radius: 12px;
    color: #50e878;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s, transform 0.1s;
    box-shadow: 0 4px 0 #0a120a;
  }
  .btn:active {
    background: #1a3a1a;
    transform: translateY(3px);
    box-shadow: 0 1px 0 #0a120a;
  }
  #btnUp    { grid-column: 2; grid-row: 1; }
  #btnLeft  { grid-column: 1; grid-row: 2; }
  #btnDown  { grid-column: 2; grid-row: 2; }
  #btnRight { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="controls">
  <div class="btn" id="btnUp">▲</div>
  <div class="btn" id="btnLeft">◀</div>
  <div class="btn" id="btnDown">▼</div>
  <div class="btn" id="btnRight">▶</div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const isMobile = window.innerWidth < 600;
const CW = Math.min(window.innerWidth - 16, 520);
const CH = isMobile ? 220 : 280;
canvas.width  = CW;
canvas.height = CH;

const GROUND_Y = CH - 55;
const DINO_X   = 80;
const GRAVITY  = 0.7;
const JUMP_VEL = -13;

const SKIN_COLORS = [
  '#50e878','#e85050','#5080e8','#e8c850','#e850c8',
  '#50c8e8','#e88850','#a850e8','#e8e8e8','#888888'
];
const HATS = ['none','party','crown','tophat'];
const HAT_LABELS = ['NONE','PARTY','CROWN','TOP HAT'];

let selectedSkin = 0;
let selectedHat  = 0;
let screen = 'menu';
let menuZones = [];

// clouds shared
let clouds = [];

// game state
let dino, obstacles, particles;
let score, hiScore = 0, speed, baseSpeed;
let obsTimer, obsInterval, gameOver, started;
let keys = { up:false, down:false, left:false, right:false };

const stars = Array.from({length:60}, () => ({
  x: Math.random()*CW, y: Math.random()*(GROUND_Y-10), r: Math.random()*1.5+0.5
}));

function makeCloud() {
  return {
    x: CW + Math.random()*300,
    y: 20 + Math.random()*(GROUND_Y/2-20),
    w: 50 + Math.random()*80,
    h: 18 + Math.random()*22,
    sp: 0.3 + Math.random()*0.5
  };
}

function makeObstacle() {
  const types = [
    {w:18,h:50,yOff:0,  kind:'cactus'},
    {w:32,h:28,yOff:0,  kind:'rock'},
    {w:46,h:22,yOff:-48,kind:'bird'},
  ];
  const t = types[Math.floor(Math.random()*types.length)];
  return {x:CW+10, y:GROUND_Y-t.h+t.yOff, w:t.w, h:t.h, kind:t.kind};
}

function spawnParticles(x,y) {
  for(let i=0;i<12;i++) particles.push({
    x,y, vx:(Math.random()-.5)*5, vy:-Math.random()*5, life:1, r:2+Math.random()*4
  });
}

function initGame() {
  dino = {y:GROUND_Y-52, vy:0, ducking:false, onGround:true, w:38, h:52};
  obstacles=[]; particles=[];
  score=0; speed=5; baseSpeed=5;
  obsTimer=0; obsInterval=80;
  gameOver=false; started=false;
}

// ── Drawing utils ─────────────────────────────────────────────────────────────
function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawStars() {
  const t=Date.now()/1000;
  stars.forEach((s,i)=>{
    const a=0.3+0.4*Math.abs(Math.sin(t+i));
    ctx.fillStyle=`rgba(180,200,255,${a})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
}

function drawGround() {
  ctx.fillStyle='#28c850'; ctx.fillRect(0,GROUND_Y,CW,5);
  ctx.fillStyle='#0a1a0a'; ctx.fillRect(0,GROUND_Y+5,CW,CH-GROUND_Y-5);
}

function drawCloud(c) {
  ctx.fillStyle='#1a2a2a';
  ctx.beginPath();
  ctx.ellipse(c.x+c.w/2,c.y+c.h/2,c.w/2,c.h/2,0,0,Math.PI*2);
  ctx.fill();
}

// ── Hat drawing ───────────────────────────────────────────────────────────────
function drawHat(hat, cx, ty, s) {
  s = s||1;
  if(hat==='party') {
    ctx.fillStyle='#ff4488';
    ctx.beginPath();
    ctx.moveTo(cx,ty-22*s); ctx.lineTo(cx-10*s,ty); ctx.lineTo(cx+10*s,ty);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#ffdd00'; ctx.lineWidth=2*s;
    ctx.beginPath(); ctx.moveTo(cx-5*s,ty-11*s); ctx.lineTo(cx+5*s,ty-11*s); ctx.stroke();
    ctx.fillStyle='#ffdd00';
    ctx.beginPath(); ctx.arc(cx,ty-23*s,4*s,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#cc2266'; ctx.fillRect(cx-12*s,ty-3*s,24*s,4*s);
  } else if(hat==='crown') {
    ctx.fillStyle='#ffd700'; ctx.fillRect(cx-12*s,ty-8*s,24*s,8*s);
    ctx.beginPath();
    ctx.moveTo(cx-12*s,ty-8*s); ctx.lineTo(cx-8*s,ty-18*s);
    ctx.lineTo(cx-2*s,ty-10*s); ctx.lineTo(cx,ty-20*s);
    ctx.lineTo(cx+2*s,ty-10*s); ctx.lineTo(cx+8*s,ty-18*s);
    ctx.lineTo(cx+12*s,ty-8*s); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff2244'; ctx.beginPath(); ctx.arc(cx,ty-12*s,3*s,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2244ff';
    ctx.beginPath(); ctx.arc(cx-8*s,ty-5*s,2*s,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+8*s,ty-5*s,2*s,0,Math.PI*2); ctx.fill();
  } else if(hat==='tophat') {
    ctx.fillStyle='#1a1a1a';
    ctx.fillRect(cx-14*s,ty-4*s,28*s,5*s);
    ctx.fillRect(cx-9*s,ty-22*s,18*s,18*s);
    ctx.fillStyle='#8b4513'; ctx.fillRect(cx-9*s,ty-7*s,18*s,3*s);
  }
}

// ── Dino drawing ──────────────────────────────────────────────────────────────
function drawDino() {
  const color = SKIN_COLORS[selectedSkin];
  const hat   = HATS[selectedHat];
  const dy = Math.round(dino.y);
  const dw = dino.ducking ? 54 : dino.w;
  const dh = dino.ducking ? 28 : dino.h;
  ctx.fillStyle = color;
  roundRect(DINO_X, dino.ducking ? GROUND_Y-dh : dy, dw, dh, 6); ctx.fill();
  if(!dino.ducking) {
    ctx.fillStyle='#0a0a12';
    ctx.beginPath(); ctx.arc(DINO_X+dw-8,dy+10,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(DINO_X+dw-6,dy+8,2,0,Math.PI*2); ctx.fill();
    const t=Date.now();
    const l1=8+6*Math.abs(Math.sin(t/100));
    const l2=8+6*Math.abs(Math.cos(t/100));
    ctx.fillStyle=color;
    roundRect(DINO_X+6,dy+dh,9,l1,3); ctx.fill();
    roundRect(DINO_X+22,dy+dh,9,l2,3); ctx.fill();
    roundRect(DINO_X+dw,dy+18,10,6,3); ctx.fill();
    if(hat!=='none') drawHat(hat, DINO_X+dw/2, dy, 1);
  } else {
    ctx.fillStyle='#0a0a12';
    ctx.beginPath(); ctx.arc(DINO_X+dw-8,GROUND_Y-dh+9,5,0,Math.PI*2); ctx.fill();
  }
}

function drawDinoPreview(x, y, color, hat, s) {
  s=s||1;
  const dw=38*s, dh=52*s;
  ctx.fillStyle=color;
  roundRect(x-dw/2, y-dh, dw, dh, 6*s); ctx.fill();
  ctx.fillStyle='#0a0a12';
  ctx.beginPath(); ctx.arc(x-dw/2+dw-8*s, y-dh+10*s, 5*s, 0, Math.PI*2); ctx.fill();
  if(hat!=='none') drawHat(hat, x, y-dh, s);
}

function drawObstacle(o) {
  if(o.kind==='cactus') {
    ctx.fillStyle='#e84040';
    roundRect(o.x,o.y,o.w,o.h,4); ctx.fill();
    roundRect(o.x-9,o.y+10,9,16,3); ctx.fill();
    roundRect(o.x+o.w,o.y+16,9,12,3); ctx.fill();
  } else if(o.kind==='rock') {
    ctx.fillStyle='#cc3333';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2); ctx.fill();
  } else {
    const flap=Math.floor(Date.now()/200)%2;
    ctx.fillStyle='#ffb020'; roundRect(o.x,o.y,o.w,o.h,5); ctx.fill();
    ctx.fillStyle='#ffd060';
    roundRect(o.x+6, flap?o.y-10:o.y+5, o.w-12, 12, 4); ctx.fill();
  }
}

function drawParticles() {
  particles.forEach(p=>{
    ctx.fillStyle=`rgba(80,232,120,${p.life})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
  });
}

// ── Collision ─────────────────────────────────────────────────────────────────
function dinoRect() {
  if(dino.ducking) return {x:DINO_X,y:GROUND_Y-28,w:54,h:28};
  return {x:DINO_X,y:dino.y,w:dino.w,h:dino.h};
}
function collides(a,b) {
  const p=6;
  return a.x+p<b.x+b.w-p && a.x+a.w-p>b.x+p && a.y+p<b.y+b.h-p && a.y+a.h-p>b.y+p;
}

// ── Menu zones ────────────────────────────────────────────────────────────────
function addZone(x,y,w,h,action) { menuZones.push({x,y,w,h,action}); }
function handleTap(px,py) {
  for(const z of menuZones) {
    if(px>=z.x && px<=z.x+z.w && py>=z.y && py<=z.y+z.h){ z.action(); return; }
  }
}

// ── Menu ──────────────────────────────────────────────────────────────────────
function drawMenu() {
  menuZones=[];
  ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,CW,CH);
  drawStars();
  drawGround();
  clouds.forEach(drawCloud);

  // Title
  ctx.textAlign='center';
  ctx.fillStyle='#50e878';
  ctx.font=`${isMobile?17:24}px 'Press Start 2P'`;
  ctx.fillText('MR FLOOB', CW/2, isMobile?32:42);

  const fs=isMobile?8:10;

  // Hat chooser
  ctx.fillStyle='#aaffaa';
  ctx.font=`${fs}px 'Press Start 2P'`;
  ctx.fillText('CHOOSE HAT', CW/2, isMobile?50:64);

  const s = isMobile?0.55:0.7;
  const hatY = isMobile?92:114;
  const spacing = CW/(HATS.length+1);

  for(let i=0;i<HATS.length;i++) {
    const hx=spacing*(i+1);
    const bw=isMobile?44:54, bh=68*s+18;
    const by=hatY-58*s-6;
    if(i===selectedHat) {
      ctx.fillStyle='rgba(80,232,120,0.15)';
      roundRect(hx-bw/2,by,bw,bh,6); ctx.fill();
      ctx.strokeStyle='#50e878'; ctx.lineWidth=2;
      roundRect(hx-bw/2,by,bw,bh,6); ctx.stroke();
    }
    drawDinoPreview(hx, hatY, SKIN_COLORS[selectedSkin], HATS[i], s);
    ctx.fillStyle=i===selectedHat?'#50e878':'#446644';
    ctx.font=`${isMobile?7:8}px 'Press Start 2P'`;
    ctx.fillText(HAT_LABELS[i], hx, hatY+12);
    const idx=i;
    addZone(hx-bw/2, by, bw, bh+8, ()=>{ selectedHat=idx; });
  }

  // Skin chooser
  const skinLabelY=isMobile?140:170;
  ctx.fillStyle='#aaffaa';
  ctx.font=`${fs}px 'Press Start 2P'`;
  ctx.fillText('CHOOSE COLOR', CW/2, skinLabelY);

  const sw=isMobile?18:22, sg=isMobile?4:6;
  const totalW=SKIN_COLORS.length*(sw+sg)-sg;
  const sx0=(CW-totalW)/2;
  const swY=skinLabelY+12;

  for(let i=0;i<SKIN_COLORS.length;i++) {
    const sx=sx0+i*(sw+sg);
    ctx.fillStyle=SKIN_COLORS[i];
    roundRect(sx,swY,sw,sw,4); ctx.fill();
    if(i===selectedSkin) {
      ctx.strokeStyle='#fff'; ctx.lineWidth=2;
      roundRect(sx-2,swY-2,sw+4,sw+4,5); ctx.stroke();
    }
    const idx=i;
    addZone(sx-4,swY-4,sw+8,sw+8,()=>{ selectedSkin=idx; });
  }

  // Play button
  const btnY=isMobile?182:218;
  const btnW=isMobile?130:160, btnH=isMobile?28:34;
  const btnX=CW/2-btnW/2;
  ctx.fillStyle='#50e878';
  roundRect(btnX,btnY,btnW,btnH,8); ctx.fill();
  ctx.fillStyle='#0a0a12';
  ctx.font=`${isMobile?11:13}px 'Press Start 2P'`;
  ctx.fillText('PLAY!', CW/2, btnY+btnH/2+4);
  addZone(btnX,btnY,btnW,btnH,()=>{ screen='game'; initGame(); });

  ctx.textAlign='left';
}

// ── Game update ───────────────────────────────────────────────────────────────
function updateGame() {
  if(!started||gameOver) return;
  score++;
  if(!dino.onGround) {
    dino.vy+=GRAVITY; dino.y+=dino.vy;
    if(dino.y>=GROUND_Y-dino.h){ dino.y=GROUND_Y-dino.h; dino.vy=0; dino.onGround=true; }
  }
  if(keys.down&&dino.onGround) dino.ducking=true;
  else if(!keys.down) dino.ducking=false;
  if(keys.right) speed=Math.min(baseSpeed+5,speed+0.06);
  else if(keys.left) speed=Math.max(2.5,speed-0.06);
  else speed=baseSpeed;
  baseSpeed=5+score/700;
  obsTimer++;
  if(obsTimer>=obsInterval){ obstacles.push(makeObstacle()); obsTimer=0; obsInterval=50+Math.random()*60; }
  obstacles.forEach(o=>{ o.x-=speed; });
  obstacles=obstacles.filter(o=>o.x+o.w>0);
  const dr=dinoRect();
  for(const o of obstacles) {
    if(collides(dr,o)){ gameOver=true; hiScore=Math.max(hiScore,score); spawnParticles(DINO_X+20,dino.y+20); return; }
  }
  clouds.forEach(c=>{ c.x-=c.sp; if(c.x+c.w<0){Object.assign(c,makeCloud());c.x=CW+10;} });
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.04; });
  particles=particles.filter(p=>p.life>0);
}

// ── Game draw ─────────────────────────────────────────────────────────────────
function drawGame() {
  menuZones=[];
  ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,CW,CH);
  drawStars(); clouds.forEach(drawCloud); drawGround();
  obstacles.forEach(drawObstacle); drawDino(); drawParticles();

  // HUD
  ctx.fillStyle=SKIN_COLORS[selectedSkin];
  ctx.font=`${isMobile?9:11}px 'Press Start 2P'`;
  ctx.fillText(`SCORE ${String(score).padStart(6,'0')}`, CW-(isMobile?150:185), 20);
  ctx.fillStyle='#2a8a40';
  ctx.fillText(`BEST  ${String(hiScore).padStart(6,'0')}`, CW-(isMobile?150:185), 36);
  ctx.fillStyle='#3060ff';
  ctx.fillText(`SPD ${speed.toFixed(1)}`, 10, 20);

  if(!started) {
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,CW,CH);
    ctx.textAlign='center';
    ctx.fillStyle=SKIN_COLORS[selectedSkin];
    ctx.font=`${isMobile?15:21}px 'Press Start 2P'`;
    ctx.fillText('MR FLOOB', CW/2, CH/2-30);
    ctx.font=`${isMobile?9:11}px 'Press Start 2P'`;
    ctx.fillStyle='#aaffaa';
    ctx.fillText('TAP  ▲  TO  START', CW/2, CH/2+4);
    ctx.textAlign='left';
  }

  if(gameOver) {
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,CW,CH);
    ctx.textAlign='center';
    ctx.fillStyle='#e84040';
    ctx.font=`${isMobile?15:21}px 'Press Start 2P'`;
    ctx.fillText('GAME OVER', CW/2, CH/2-38);
    ctx.fillStyle='#fff';
    ctx.font=`${isMobile?9:11}px 'Press Start 2P'`;
    ctx.fillText(`SCORE: ${score}`, CW/2, CH/2-12);
    ctx.fillText(`BEST:  ${hiScore}`, CW/2, CH/2+6);

    // Restart
    const rbW=isMobile?120:150, rbH=isMobile?24:30;
    const rbX=CW/2-rbW/2, rbY=CH/2+18;
    ctx.fillStyle='#50e878'; roundRect(rbX,rbY,rbW,rbH,6); ctx.fill();
    ctx.fillStyle='#0a0a12'; ctx.font=`${isMobile?9:10}px 'Press Start 2P'`;
    ctx.fillText('RESTART', CW/2, rbY+rbH/2+3);
    addZone(rbX,rbY,rbW,rbH,()=>{ initGame(); started=true; dino.vy=JUMP_VEL; dino.onGround=false; });

    // Main menu
    const mbW=isMobile?150:180, mbH=isMobile?26:32;
    const mbX=CW/2-mbW/2, mbY=rbY+rbH+8;
    ctx.fillStyle='#3060ff'; roundRect(mbX,mbY,mbW,mbH,6); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font=`${isMobile?9:10}px 'Press Start 2P'`;
    ctx.fillText('MAIN MENU', CW/2, mbY+mbH/2+3);
    addZone(mbX,mbY,mbW,mbH,()=>{ screen='menu'; });

    ctx.textAlign='left';
  }
}

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop() {
  if(screen==='menu') {
    clouds.forEach(c=>{ c.x-=c.sp; if(c.x+c.w<0){Object.assign(c,makeCloud());c.x=CW+10;} });
    drawMenu();
  } else {
    updateGame(); drawGame();
  }
  requestAnimationFrame(loop);
}

// ── Input ─────────────────────────────────────────────────────────────────────
function getTap(e, touch) {
  const r=canvas.getBoundingClientRect();
  const src=touch?e.changedTouches[0]:e;
  return { x:(src.clientX-r.left)*(CW/r.width), y:(src.clientY-r.top)*(CH/r.height) };
}

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const p=getTap(e,true);
  handleTap(p.x,p.y);
}, {passive:false});

canvas.addEventListener('click', e=>{
  const p=getTap(e,false);
  handleTap(p.x,p.y);
});

function setupBtn(id, key) {
  const el=document.getElementById(id);
  const press=(e)=>{
    e.preventDefault(); keys[key]=true;
    if(key==='up'&&screen==='game') {
      if(!started){started=true;return;}
      if(!gameOver&&dino.onGround){dino.vy=JUMP_VEL;dino.onGround=false;dino.ducking=false;}
    }
  };
  const release=(e)=>{e.preventDefault();keys[key]=false;};
  el.addEventListener('touchstart',press,{passive:false});
  el.addEventListener('touchend',release,{passive:false});
  el.addEventListener('mousedown',press);
  el.addEventListener('mouseup',release);
}
setupBtn('btnUp','up'); setupBtn('btnDown','down');
setupBtn('btnLeft','left'); setupBtn('btnRight','right');

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){
    keys.up=true;
    if(screen==='game'){
      if(!started){started=true;return;}
      if(!gameOver&&dino.onGround){dino.vy=JUMP_VEL;dino.onGround=false;dino.ducking=false;}
    }
  }
  if(e.key==='ArrowDown') keys.down=true;
  if(e.key==='ArrowLeft') keys.left=true;
  if(e.key==='ArrowRight') keys.right=true;
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp') keys.up=false;
  if(e.key==='ArrowDown') keys.down=false;
  if(e.key==='ArrowLeft') keys.left=false;
  if(e.key==='ArrowRight') keys.right=false;
});

clouds=Array.from({length:4},makeCloud);
initGame();
loop();
</script>
</body>
</html>
