<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mr Floob</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;background:#050510;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;touch-action:none;font-family:'Press Start 2P',monospace;
}
#wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
#gameCanvas{
  display:block;border-radius:16px;
  box-shadow:0 0 60px #00ff6633,0 0 120px #00ff6611;
  border:2px solid #1a3a1a;
}
#dpad{
  display:grid;grid-template-columns:66px 66px 66px;
  grid-template-rows:66px 66px;gap:7px;
}
.btn{
  background:linear-gradient(145deg,#0f1f0f,#1a2e1a);
  border:2px solid #2a4a2a;border-radius:14px;
  color:#50e878;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  box-shadow:0 5px 0 #050f05,0 0 12px #00ff6611;
  transition:transform .07s,box-shadow .07s,background .07s;
  position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:radial-gradient(circle at 50% 0%,#50e87820,transparent 70%);pointer-events:none;
}
.btn.pressed,.btn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #050f05,0 0 20px #50e87844;
  background:linear-gradient(145deg,#1a3a1a,#254025);
}
#btnUp{grid-column:2;grid-row:1;}#btnLeft{grid-column:1;grid-row:2;}
#btnDown{grid-column:2;grid-row:2;}#btnRight{grid-column:3;grid-row:2;}
</style>
</head>
<body>
<audio id="bgMusic" src="freesound_community-tam-xa-mai-56766.mp3" loop></audio>
<div id="wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="dpad">
    <div class="btn" id="btnUp">▲</div>
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnDown">▼</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
</div>
<script>
// ═══════════════════════════════════════════════
//  MR FLOOB — COINS + SHOP EDITION
// ═══════════════════════════════════════════════

const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.5;
function tryPlay(){ bgMusic.play().catch(()=>{}); }
window.addEventListener('load',()=>{
  bgMusic.play().catch(()=>{
    document.body.addEventListener('click',()=>bgMusic.play(),{once:true});
    document.body.addEventListener('touchstart',()=>bgMusic.play(),{once:true});
  });
});

// ── Canvas ────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const isMobile = window.innerWidth < 640;
const CW = Math.min(window.innerWidth-12,560);
const CH = isMobile?230:290;
canvas.width=CW; canvas.height=CH;
const GY=CH-60, DINO_X=90, GRAV=1500, JUMP_V=-560, JUMP_HOLD=-280;

// ── Persistence (localStorage) ────────────────
let totalCoins   = parseInt(localStorage.getItem('mf_coins')||'0');
let unlockedBgs  = JSON.parse(localStorage.getItem('mf_unlocked')||'["default"]');
let activeBg     = localStorage.getItem('mf_bg')||'default';
let potions      = JSON.parse(localStorage.getItem('mf_potions')||'{"slow":0,"revive":0,"immune":0}');
function save(){
  localStorage.setItem('mf_coins',totalCoins);
  localStorage.setItem('mf_unlocked',JSON.stringify(unlockedBgs));
  localStorage.setItem('mf_bg',activeBg);
  localStorage.setItem('mf_potions',JSON.stringify(potions));
}

// ── Customisation ─────────────────────────────
const SKINS=['#50e878','#ff5555','#5599ff','#ffd700','#ff55cc','#55ddee','#ff9944','#bb55ff','#eeeeee','#999999'];
const HATS=['none','party','crown','tophat'];
const HAT_NAMES=['NONE','PARTY','CROWN','TOP'];
let skinIdx=0, hatIdx=0;

// Backgrounds catalog
const BG_LIST=[
  {id:'default', name:'DEFAULT', price:0,  emoji:'🌌', desc:'Classic night sky'},
  {id:'desert',  name:'DESERT',  price:50, emoji:'🏜️', desc:'Hot sandy dunes'},
  {id:'forest',  name:'FOREST',  price:50, emoji:'🌲', desc:'Dark mystic woods'},
  {id:'city',    name:'CITY',    price:50, emoji:'🌆', desc:'Neon city night'},
];

// ── Screen ────────────────────────────────────
// 'menu'|'shop'|'fadein'|'game'
let SCREEN='menu', fadeAlpha=1;

// ── Stars ─────────────────────────────────────
const STARS=Array.from({length:80},()=>({
  x:Math.random()*CW,y:Math.random()*(GY-10),
  r:Math.random()*1.8+0.3,phase:Math.random()*Math.PI*2,spd:0.5+Math.random()*1.2
}));
let shootStars=[],shootTimer=0;

// ── Parallax elements (one set per bg) ────────
// DEFAULT
const D_MTNS=Array.from({length:7},(_,i)=>({x:i*(CW/3.5),w:CW/3.5+50,h:45+Math.random()*55,spd:.25}));
const D_HILLS=Array.from({length:9},(_,i)=>({x:i*(CW/4),w:CW/4+40,h:22+Math.random()*32,spd:.6}));
// DESERT
const DS_DUNES_FAR=Array.from({length:6},(_,i)=>({x:i*(CW/3),w:CW/3+60,h:30+Math.random()*40,spd:.2}));
const DS_DUNES_NEAR=Array.from({length:8},(_,i)=>({x:i*(CW/4),w:CW/4+50,h:18+Math.random()*28,spd:.55}));
// FOREST
const FR_TREES_FAR=Array.from({length:10},(_,i)=>({x:i*(CW/5),w:22+Math.random()*18,h:55+Math.random()*50,spd:.18}));
const FR_TREES_NEAR=Array.from({length:14},(_,i)=>({x:i*(CW/5.5),w:16+Math.random()*14,h:35+Math.random()*35,spd:.5}));
// CITY
const CT_BLDGS_FAR=Array.from({length:8},(_,i)=>({x:i*(CW/4),w:35+Math.random()*55,h:50+Math.random()*80,spd:.2,windows:[]}));
const CT_BLDGS_NEAR=Array.from({length:10},(_,i)=>({x:i*(CW/5),w:28+Math.random()*42,h:35+Math.random()*55,spd:.55,windows:[]}));
// Init city windows
[...CT_BLDGS_FAR,...CT_BLDGS_NEAR].forEach(b=>{
  b.windows=Array.from({length:Math.floor(b.w/10)*Math.floor(b.h/14)},()=>Math.random()<.55);
});

// GDOTS (ground detail, used for all bgs)
const GDOTS=Array.from({length:22},()=>({x:Math.random()*CW,y:GY+8+Math.random()*16,w:4+Math.random()*14,h:3+Math.random()*5,spd:1}));

let clouds=Array.from({length:5},makeCloud);
function makeCloud(){
  return{x:CW+Math.random()*400,y:18+Math.random()*(GY/2-22),rx:38+Math.random()*65,ry:13+Math.random()*18,spd:.4+Math.random()*.6,a:.10+Math.random()*.16};
}

// ── Game state ────────────────────────────────
let dino,obstacles,particles,dust,coinObjs;
let score,displayScore,hiScore=0,speed,baseSpeed;
let obsTimer,obsInterval,gameOver,started;
let shakeX=0,shakeY=0,shakeTmr=0;
let jumpHeld=false,jumpAt=0;
let mFlash=0,goAnim=0,goTarget=0;
let sessionCoins=0,coinSpawnTimer=0;
// Potion active timers
let slowTimer=0, immuneTimer=0, hasRevive=false;
let activePotion=''; // for HUD flash
let potionFlash=0;
const keys={up:false,down:false,left:false,right:false};
let menuZones=[];

function initGame(){
  dino={y:GY-58,vy:0,ducking:false,onGround:true,w:40,h:58,glow:0};
  obstacles=[];particles=[];dust=[];coinObjs=[];
  score=0;displayScore=0;speed=5;baseSpeed=5;
  obsTimer=0;obsInterval=88;gameOver=false;started=false;
  shakeTmr=0;shakeX=0;shakeY=0;mFlash=0;
  sessionCoins=0;coinSpawnTimer=0;
  slowTimer=0;immuneTimer=0;hasRevive=false;activePotion='';potionFlash=0;
}

// ── Emit helpers ──────────────────────────────
function emit(x,y,n,vxS,vyS,col,life,sz){
  for(let i=0;i<n;i++) particles.push({
    x,y,vx:(Math.random()-.5)*vxS,vy:-Math.random()*vyS,
    col:col||SKINS[skinIdx],life:1,ml:life||1,r:(sz||3)+Math.random()*3,grav:250+Math.random()*200
  });
}
function emitDust(x,y){ dust.push({x,y:y+4,vx:-35-Math.random()*40,vy:-22-Math.random()*28,life:1,r:3+Math.random()*4}); }

// ── Obstacle factory ──────────────────────────
function makeObs(){
  // Bird randomly spawns high (duck under) or low (jump over)
  const birdHigh = Math.random()<.5;
  const birdYOff = birdHigh ? -(38+Math.random()*16) : -(10+Math.random()*14);
  const types=[
    {w:20,h:56,yOff:0,kind:'cactus'},
    {w:36,h:30,yOff:0,kind:'rock'},
    {w:52,h:24,yOff:birdYOff,kind:'bird'},
  ];
  const t=types[Math.floor(Math.random()*types.length)];
  return{x:CW+30,y:GY-t.h+t.yOff,w:t.w,h:t.h,kind:t.kind,sc:0,high:t.kind==='bird'&&birdHigh};
}

// ── Coin factory — spawns lines of 4-5, avoids obstacles & other coins ──
function spawnCoinLine(){
  const count=3+Math.floor(Math.random()*4); // 3, 4, 5, or 6
  const inAir=Math.random()<.55;
  const spacing=28;
  const startX=CW+30;
  const endX=startX+count*spacing;
  const coinY=inAir?GY-42-Math.random()*52:GY-18;
  // Don't spawn if an obstacle is anywhere near the line zone
  for(const o of obstacles){
    if(o.x<endX+80&&o.x+o.w>startX-80) return;
  }
  // Don't spawn if existing coins are too close
  for(const c of coinObjs){
    if(c.x<endX+30&&c.x>startX-30) return;
  }
  for(let i=0;i<count;i++){
    coinObjs.push({x:startX+i*spacing,y:coinY,collected:false,bob:Math.random()*Math.PI*2,sc:0});
  }
}

// ═══════════════════════════════════════════════
//  DRAW UTILS
// ═══════════════════════════════════════════════
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function hexRGB(h){return`${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;}
function lighten(hex,a){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgb(${Math.min(255,r+Math.round(255*a))},${Math.min(255,g+Math.round(255*a))},${Math.min(255,b+Math.round(255*a))})`;}
function darken(hex,a){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgb(${Math.max(0,r-Math.round(255*a))},${Math.max(0,g-Math.round(255*a))},${Math.max(0,b-Math.round(255*a))})`;}

// ═══════════════════════════════════════════════
//  BACKGROUND DRAWING
// ═══════════════════════════════════════════════

// ── DEFAULT (night) ───────────────────────────
function sky_default(){
  const t=Math.min(score/2500,1);
  const tops=['#05050f','#080520','#030a10'];
  const bots=['#0a0a1e','#1a0538','#001a0a'];
  const i=Math.min(Math.floor(t*2),1);
  const f=t*2-i;
  function lc(a,b,f){
    const ar=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
    const br=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
    return`rgb(${Math.round(ar[0]+(br[0]-ar[0])*f)},${Math.round(ar[1]+(br[1]-ar[1])*f)},${Math.round(ar[2]+(br[2]-ar[2])*f)})`;
  }
  const g=ctx.createLinearGradient(0,0,0,GY);
  g.addColorStop(0,lc(tops[i],tops[Math.min(i+1,2)],f));
  g.addColorStop(1,lc(bots[i],bots[Math.min(i+1,2)],f));
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,GY);
}
function parallax_default(dt,spd){
  ctx.fillStyle='rgba(18,12,36,0.9)';
  D_MTNS.forEach(m=>{m.x-=m.spd*spd*dt*60;if(m.x+m.w<0){m.x=CW+10;m.h=45+Math.random()*55;}
    ctx.beginPath();ctx.moveTo(m.x,GY-4);ctx.lineTo(m.x+m.w*.5,GY-4-m.h);ctx.lineTo(m.x+m.w,GY-4);ctx.closePath();ctx.fill();});
  ctx.fillStyle='rgba(8,22,12,0.85)';
  D_HILLS.forEach(h=>{h.x-=h.spd*spd*dt*60;if(h.x+h.w<0){h.x=CW+10;h.h=22+Math.random()*32;}
    ctx.beginPath();ctx.ellipse(h.x+h.w*.5,GY-2,h.w*.5,h.h,0,Math.PI,0);ctx.fill();});
}
function ground_default(dt,spd){
  const g=ctx.createLinearGradient(0,GY,0,CH);
  g.addColorStop(0,'#1ec845');g.addColorStop(.06,'#0b6a22');g.addColorStop(1,'#040f04');
  ctx.fillStyle=g;ctx.fillRect(0,GY,CW,CH-GY);
  GDOTS.forEach(d=>{d.x-=d.spd*spd*dt*60;if(d.x+d.w<0){d.x=CW+10;d.y=GY+8+Math.random()*16;d.w=4+Math.random()*14;}
    ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fillRect(d.x,d.y,d.w,d.h);});
  const gg=ctx.createLinearGradient(0,GY-3,0,GY+5);
  gg.addColorStop(0,'#44ff88');gg.addColorStop(1,'transparent');
  ctx.fillStyle=gg;ctx.fillRect(0,GY-3,CW,8);
}

// ── DESERT ────────────────────────────────────
function sky_desert(){
  const g=ctx.createLinearGradient(0,0,0,GY);
  g.addColorStop(0,'#1a0500');g.addColorStop(.4,'#7a2200');g.addColorStop(1,'#e86010');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,GY);
  // Sun
  ctx.save();ctx.shadowColor='#ffdd44';ctx.shadowBlur=30;
  ctx.fillStyle='#ffcc22';ctx.beginPath();ctx.arc(CW*.75,GY*.22,isMobile?16:22,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Haze at horizon
  const haze=ctx.createLinearGradient(0,GY-30,0,GY);
  haze.addColorStop(0,'transparent');haze.addColorStop(1,'rgba(220,120,30,0.35)');
  ctx.fillStyle=haze;ctx.fillRect(0,GY-30,CW,30);
}
function parallax_desert(dt,spd){
  // Far dunes
  ctx.fillStyle='rgba(160,80,10,0.7)';
  DS_DUNES_FAR.forEach(d=>{d.x-=d.spd*spd*dt*60;if(d.x+d.w<0){d.x=CW+10;d.h=30+Math.random()*40;}
    ctx.beginPath();ctx.moveTo(d.x,GY);ctx.quadraticCurveTo(d.x+d.w*.5,GY-d.h,d.x+d.w,GY);ctx.fill();});
  // Near dunes
  ctx.fillStyle='rgba(200,110,20,0.8)';
  DS_DUNES_NEAR.forEach(d=>{d.x-=d.spd*spd*dt*60;if(d.x+d.w<0){d.x=CW+10;d.h=18+Math.random()*28;}
    ctx.beginPath();ctx.moveTo(d.x,GY);ctx.quadraticCurveTo(d.x+d.w*.5,GY-d.h,d.x+d.w,GY);ctx.fill();});
}
function ground_desert(dt,spd){
  const g=ctx.createLinearGradient(0,GY,0,CH);
  g.addColorStop(0,'#d4860a');g.addColorStop(.08,'#a0600a');g.addColorStop(1,'#3a1f00');
  ctx.fillStyle=g;ctx.fillRect(0,GY,CW,CH-GY);
  GDOTS.forEach(d=>{d.x-=d.spd*spd*dt*60;if(d.x+d.w<0){d.x=CW+10;d.y=GY+6+Math.random()*18;d.w=6+Math.random()*18;}
    ctx.fillStyle='rgba(80,40,0,0.3)';ctx.fillRect(d.x,d.y,d.w,2);});
  // Ground glow
  const gg=ctx.createLinearGradient(0,GY-3,0,GY+6);
  gg.addColorStop(0,'#ffaa44');gg.addColorStop(1,'transparent');
  ctx.fillStyle=gg;ctx.fillRect(0,GY-3,CW,9);
}
function stars_desert(dt){
  // Fewer, warmer stars
  const T=performance.now()/1000;
  STARS.slice(0,40).forEach((s,i)=>{
    const a=0.15+0.3*Math.abs(Math.sin(T*s.spd+s.phase));
    ctx.fillStyle=`rgba(255,220,160,${a})`;
    ctx.beginPath();ctx.arc(s.x,s.y*0.6,s.r*.8,0,Math.PI*2);ctx.fill();
  });
}

// ── FOREST ────────────────────────────────────
function sky_forest(){
  const g=ctx.createLinearGradient(0,0,0,GY);
  g.addColorStop(0,'#010a03');g.addColorStop(.5,'#021508');g.addColorStop(1,'#041f0a');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,GY);
  // Moon
  ctx.save();ctx.shadowColor='#aaffcc';ctx.shadowBlur=20;
  ctx.fillStyle='#ccffdd';ctx.beginPath();ctx.arc(CW*.2,GY*.15,isMobile?10:14,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Canopy glow at top
  const cg=ctx.createLinearGradient(0,0,0,40);
  cg.addColorStop(0,'rgba(0,40,10,0.6)');cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg;ctx.fillRect(0,0,CW,40);
}
function parallax_forest(dt,spd){
  // Far trees
  ctx.fillStyle='rgba(2,20,6,0.92)';
  FR_TREES_FAR.forEach(t=>{t.x-=t.spd*spd*dt*60;if(t.x+t.w<0){t.x=CW+10;t.h=55+Math.random()*50;}
    // Trunk
    ctx.fillRect(t.x+t.w*.35,GY-t.h,t.w*.3,t.h);
    // Foliage
    ctx.beginPath();ctx.moveTo(t.x+t.w*.5,GY-t.h-t.h*.45);ctx.lineTo(t.x,GY-t.h*.5);ctx.lineTo(t.x+t.w,GY-t.h*.5);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(t.x+t.w*.5,GY-t.h-t.h*.3);ctx.lineTo(t.x+t.w*.1,GY-t.h*.72);ctx.lineTo(t.x+t.w*.9,GY-t.h*.72);ctx.closePath();ctx.fill();
  });
  // Near trees
  ctx.fillStyle='rgba(4,35,10,0.96)';
  FR_TREES_NEAR.forEach(t=>{t.x-=t.spd*spd*dt*60;if(t.x+t.w<0){t.x=CW+10;t.h=35+Math.random()*35;}
    ctx.fillRect(t.x+t.w*.35,GY-t.h,t.w*.3,t.h);
    ctx.beginPath();ctx.moveTo(t.x+t.w*.5,GY-t.h-t.h*.5);ctx.lineTo(t.x,GY-t.h*.45);ctx.lineTo(t.x+t.w,GY-t.h*.45);ctx.closePath();ctx.fill();
  });
}
function ground_forest(dt,spd){
  const g=ctx.createLinearGradient(0,GY,0,CH);
  g.addColorStop(0,'#0d4018');g.addColorStop(.07,'#072a0e');g.addColorStop(1,'#020d04');
  ctx.fillStyle=g;ctx.fillRect(0,GY,CW,CH-GY);
  GDOTS.forEach(d=>{d.x-=d.spd*spd*dt*60;if(d.x+d.w<0){d.x=CW+10;d.y=GY+5+Math.random()*20;d.w=3+Math.random()*10;}
    ctx.fillStyle='rgba(0,60,10,0.4)';ctx.beginPath();ctx.ellipse(d.x,d.y,d.w,d.h,0,0,Math.PI*2);ctx.fill();});
  const gg=ctx.createLinearGradient(0,GY-3,0,GY+6);
  gg.addColorStop(0,'#22ff66');gg.addColorStop(1,'transparent');
  ctx.fillStyle=gg;ctx.fillRect(0,GY-3,CW,9);
}
function stars_forest(dt){
  // Few stars, greenish tint (filtered through canopy)
  const T=performance.now()/1000;
  STARS.slice(0,30).forEach((s,i)=>{
    const a=0.1+0.2*Math.abs(Math.sin(T*s.spd+s.phase));
    ctx.fillStyle=`rgba(150,255,180,${a})`;
    ctx.beginPath();ctx.arc(s.x,s.y*.7,s.r*.7,0,Math.PI*2);ctx.fill();
  });
}

// ── CITY ──────────────────────────────────────
function sky_city(){
  const g=ctx.createLinearGradient(0,0,0,GY);
  g.addColorStop(0,'#05020f');g.addColorStop(.6,'#0f0520');g.addColorStop(1,'#1a0a30');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,GY);
  // Light pollution glow at horizon
  const lp=ctx.createRadialGradient(CW*.5,GY,0,CW*.5,GY,CW*.7);
  lp.addColorStop(0,'rgba(80,20,180,0.3)');lp.addColorStop(1,'transparent');
  ctx.fillStyle=lp;ctx.fillRect(0,GY-80,CW,80);
  // Neon accent lines
  ctx.strokeStyle='rgba(100,0,255,0.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,GY-20);ctx.lineTo(CW,GY-20);ctx.stroke();
}
function parallax_city(dt,spd){
  const T=performance.now()/1000;
  // Far buildings

function drawDinoAt(dx,dy,ducking,color,hat,s,glowAmt){

// ── Particles ─────────────────────────────────
function tickParticles(dt){
  particles.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.life-=dt/p.ml;
    const a=Math.max(0,p.life);

  dust.forEach(d=>{d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=160*dt;d.life-=dt*2.2;d.r+=dt*9;

// ── Potion activation ─────────────────────────
function activatePotion(key){
  if(!potions[key]||potions[key]<=0)return;
  potions[key]--;save();
  if(key==='slow'){slowTimer=15;activePotion='slow';}
  else if(key==='revive'){hasRevive=true;activePotion='revive';}
  else if(key==='immune'){immuneTimer=10;activePotion='immune';}
  emit(DINO_X+20,dino.y,16,150,200,key==='slow'?'#88aaff':key==='immune'?'#ffd700':'#50e878',1,4);
}

// ── Collision ─────────────────────────────────
function dinoRect(){if(dino.ducking)return{x:DINO_X,y:GY-30,w:58,h:30};return{x:DINO_X,y:dino.y,w:dino.w,h:dino.h};}
function collides(a,b){const p=2;return a.x+p<b.x+b.w-p&&a.x+a.w-p>b.x+p&&a.y+p<b.y+b.h-p&&a.y+a.h-p>b.y+p;}

function handleTap(px,py){for(const z of menuZones)if(px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h){z.fn();return;}}

// ═══════════════════════════════════════════════
//  GAME UPDATE
// ═══════════════════════════════════════════════
function updateGame(dt){
  if(!started||gameOver)return;
  score+=dt*100;displayScore+=(score-displayScore)*Math.min(1,dt*9);

  const prev=Math.floor((score-dt*100)/100);const curr=Math.floor(score/100);
  if(curr>prev&&curr>0){mFlash=1;emit(DINO_X+20,dino.y,22,220,320,SKINS[skinIdx],1.3,4);}
  if(mFlash>0)mFlash=Math.max(0,mFlash-dt*3.2);

  dino.glow=.28+.28*Math.abs(Math.sin(performance.now()/380));
  if(!dino.onGround){
    if(keys.up&&jumpHeld&&(performance.now()-jumpAt)<210)dino.vy+=JUMP_HOLD*dt;
    dino.vy+=GRAV*dt;dino.y+=dino.vy*dt;
    if(dino.y>=GY-dino.h){dino.y=GY-dino.h;dino.vy=0;dino.onGround=true;emit(DINO_X+10,GY,8,90,70,'rgba(50,200,80,0.9)',.5,3);}
  }
  if(keys.down&&dino.onGround)dino.ducking=true;else if(!keys.down)dino.ducking=false;
  // Potion timers
  if(slowTimer>0){ slowTimer=Math.max(0,slowTimer-dt); }
  if(immuneTimer>0){ immuneTimer=Math.max(0,immuneTimer-dt); }

  // Speed (apply slow potion)
  const spdCap = slowTimer>0 ? Math.min(baseSpeed,4) : baseSpeed+6;
  if(keys.right)speed=Math.min(spdCap,speed+.13);
  else if(keys.left)speed=Math.max(2.5,speed-.11);
  else speed+=(( slowTimer>0?Math.min(baseSpeed,3.5):baseSpeed)-speed)*Math.min(1,dt*4.5);
  baseSpeed=5+score/900;
  if(dino.onGround&&!dino.ducking&&Math.random()<.28)emitDust(DINO_X+5,GY);

  // Obstacles — skip spawn if coins are nearby
  obsTimer+=dt*60;
  if(obsTimer>=obsInterval){
    const nextObs=makeObs();
    let coinTooClose=false;
    for(const c of coinObjs){
      if(c.x<nextObs.x+nextObs.w+80&&c.x>nextObs.x-80){coinTooClose=true;break;}
    }
    if(!coinTooClose){obstacles.push(nextObs);obsTimer=0;obsInterval=50+Math.random()*56;}
    else{obsTimer=obsInterval-10;} // retry soon
  }
  obstacles.forEach(o=>{o.x-=speed*dt*60;o.sc=Math.min(1,o.sc+dt*7);});
  obstacles=obstacles.filter(o=>o.x+o.w>0);

  // Coins — spawn lines of 4-5 every 3-5 seconds
  coinSpawnTimer+=dt;
  if(coinSpawnTimer>=3+Math.random()*2){spawnCoinLine();coinSpawnTimer=0;}
  coinObjs.forEach(c=>{c.x-=speed*dt*60;c.sc=Math.min(1,c.sc+dt*6);});

  // Coin collection
  const dr=dinoRect();
  coinObjs.forEach(c=>{
    if(c.collected)return;
    if(dr.x<c.x+12&&dr.x+dr.w>c.x-12&&dr.y<c.y+12&&dr.y+dr.h>c.y-12){
      c.collected=true;sessionCoins++;
      emit(c.x,c.y,12,120,160,'#ffd700',.7,3);
    }
  });
  coinObjs=coinObjs.filter(c=>c.x+12>0&&!c.collected);

  // Collision with obstacles
  for(const o of obstacles){
    if(collides(dr,o)){
      if(immuneTimer>0) continue; // immune — skip
      if(hasRevive){
        // Use revive — bounce back, clear nearby obstacles
        hasRevive=false;
        obstacles.length=0;
        emit(DINO_X+20,dino.y+24,24,200,300,'#50e878',1.2,5);
        dino.vy=JUMP_V*.6;dino.onGround=false;
        shakeTmr=.3;break;
      }
      gameOver=true;
      totalCoins+=sessionCoins;save();
      hiScore=Math.max(hiScore,Math.floor(score));
      goTarget=Math.floor(score);goAnim=0;
      emit(DINO_X+20,dino.y+24,32,320,420,SKINS[skinIdx],1.6,5);
      emit(DINO_X+20,dino.y+24,16,220,300,'#ffffff',1.1,3);
      shakeTmr=.55;return;
    }
  }

  if(shakeTmr>0){shakeTmr=Math.max(0,shakeTmr-dt);shakeX=(Math.random()-.5)*11*shakeTmr;shakeY=(Math.random()-.5)*9*shakeTmr;}else{shakeX=0;shakeY=0;}
  clouds.forEach(c=>{c.x-=c.spd*(speed/5)*dt*60;if(c.x+c.rx*2<0){Object.assign(c,makeCloud());c.x=CW+50;}});
}

function drawGame(dt){
  menuZones=[];
  ctx.fillStyle='#050510';ctx.fillRect(0,0,CW,CH);

  drawDinoAt(DINO_X,dino.ducking?GY-30:Math.round(dino.y),dino.ducking,SKINS[skinIdx],HATS[hatIdx],1,dino.glow);
  tickParticles(dt);ctx.restore();
  drawHUD();

  if(!started){
    ctx.fillStyle='rgba(5,5,16,.52)';ctx.fillRect(0,0,CW,CH);ctx.textAlign='center';
    ctx.save();ctx.shadowColor=SKINS[skinIdx];ctx.shadowBlur=28;ctx.fillStyle=SKINS[skinIdx];ctx.font=`${isMobile?15:20}px 'Press Start 2P'`;ctx.fillText('MR FLOOB',CW/2,CH/2-32);ctx.restore();
    ctx.fillStyle='rgba(170,255,170,.85)';ctx.font=`${isMobile?9:11}px 'Press Start 2P'`;ctx.fillText('TAP  ▲  TO  START',CW/2,CH/2+5);ctx.textAlign='left';
  }

  if(gameOver){
    goAnim=Math.min(goTarget,goAnim+goTarget*dt*2.2);
    ctx.fillStyle='rgba(5,5,16,.72)';ctx.fillRect(0,0,CW,CH);ctx.textAlign='center';
    ctx.save();ctx.shadowColor='#ff4040';ctx.shadowBlur=28;ctx.fillStyle='#ff4040';ctx.font=`${isMobile?15:20}px 'Press Start 2P'`;ctx.fillText('GAME OVER',CW/2,CH/2-48);ctx.restore();
    ctx.fillStyle='#fff';ctx.font=`${isMobile?9:11}px 'Press Start 2P'`;
    ctx.fillText(`SCORE: ${String(Math.floor(goAnim)).padStart(6,'0')}`,CW/2,CH/2-22);
    if(Math.floor(score)>=hiScore&&Math.floor(score)>0){ctx.fillStyle='#ffd700';ctx.font=`${isMobile?7:9}px 'Press Start 2P'`;ctx.fillText('✦ NEW BEST! ✦',CW/2,CH/2-4);}
    else{ctx.fillStyle='#50e878';ctx.font=`${isMobile?9:11}px 'Press Start 2P'`;ctx.fillText(`BEST: ${hiScore}`,CW/2,CH/2-4);}
    // Coins earned
    ctx.save();ctx.shadowColor='#ffd700';ctx.shadowBlur=10;ctx.fillStyle='#ffd700';ctx.font=`${isMobile?8:10}px 'Press Start 2P'`;ctx.fillText(`+${sessionCoins} COINS  (${totalCoins} total)`,CW/2,CH/2+14);ctx.restore();

    // Restart
    const rbW=isMobile?130:155,rbH=isMobile?26:32,rbX=CW/2-rbW/2,rbY=CH/2+28;
    ctx.save();ctx.shadowColor='#50e878';ctx.shadowBlur=14;ctx.fillStyle='#20a840';rr(rbX,rbY,rbW,rbH,8);ctx.fill();ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.12)';rr(rbX+4,rbY+4,rbW-8,rbH/2-4,5);ctx.fill();
    ctx.textAlign='center';ctx.fillStyle='#040d08';ctx.font=`${isMobile?9:10}px 'Press Start 2P'`;ctx.fillText('RESTART',CW/2,rbY+rbH/2+4);
    addZone(rbX,rbY,rbW,rbH,()=>{initGame();started=true;dino.vy=JUMP_V;dino.onGround=false;jumpHeld=true;jumpAt=performance.now();});

    // Main menu
    const mbW=isMobile?150:180,mbH=isMobile?26:32,mbX=CW/2-mbW/2,mbY=rbY+rbH+7;
    ctx.save();ctx.shadowColor='#3060ff';ctx.shadowBlur=12;ctx.fillStyle='#182ea0';rr(mbX,mbY,mbW,mbH,8);ctx.fill();ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.1)';rr(mbX+4,mbY+4,mbW-8,mbH/2-4,5);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`${isMobile?9:10}px 'Press Start 2P'`;ctx.fillText('MAIN MENU',CW/2,mbY+mbH/2+4);
    addZone(mbX,mbY,mbW,mbH,()=>{SCREEN='menu';clouds=Array.from({length:5},makeCloud);});
    ctx.textAlign='left';
  }
}

// ═══════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;
  if(SCREEN==='menu'){
    clouds.forEach(c=>{c.x-=c.spd*.5*dt*60;if(c.x+c.rx*2<0){Object.assign(c,makeCloud());c.x=CW+50;}});
    drawMenu(dt);
  }else if(SCREEN==='shop'){
    drawShop(dt);
  }else if(SCREEN==='fadein'){
    updateGame(dt);drawGame(dt);
    fadeAlpha=Math.max(0,fadeAlpha-dt*3);
    ctx.fillStyle=`rgba(5,5,16,${fadeAlpha})`;ctx.fillRect(0,0,CW,CH);
    if(fadeAlpha<=0)SCREEN='game';
  }else{updateGame(dt);drawGame(dt);}
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════
function getTap(e,touch){const r=canvas.getBoundingClientRect();const src=touch?e.changedTouches[0]:e;return{x:(src.clientX-r.left)*(CW/r.width),y:(src.clientY-r.top)*(CH/r.height)};}
canvas.addEventListener('touchstart',e=>{e.preventDefault();const p=getTap(e,true);handleTap(p.x,p.y);},{passive:false});
canvas.addEventListener('click',e=>{const p=getTap(e,false);handleTap(p.x,p.y);});

function setupBtn(id,key){
  const el=document.getElementById(id);
  const press=e=>{
    e.preventDefault();keys[key]=true;el.classList.add('pressed');
    if(key==='up'&&SCREEN==='game'){
      if(!started){started=true;return;}
      if(!gameOver&&dino.onGround){dino.vy=JUMP_V;dino.onGround=false;jumpHeld=true;jumpAt=performance.now();emit(DINO_X+20,GY,10,110,160,SKINS[skinIdx],.45,3);}
    }
  };
  const release=e=>{e.preventDefault();keys[key]=false;el.classList.remove('pressed');if(key==='up')jumpHeld=false;};
  el.addEventListener('touchstart',press,{passive:false});el.addEventListener('touchend',release,{passive:false});
  el.addEventListener('mousedown',press);el.addEventListener('mouseup',release);el.addEventListener('mouseleave',release);
}
setupBtn('btnUp','up');setupBtn('btnDown','down');setupBtn('btnLeft','left');setupBtn('btnRight','right');
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'&&!keys.up){keys.up=true;if(SCREEN==='game'){if(!started){started=true;return;}if(!gameOver&&dino.onGround){dino.vy=JUMP_V;dino.onGround=false;jumpHeld=true;jumpAt=performance.now();emit(DINO_X+20,GY,10,110,160,SKINS[skinIdx],.45,3);}}}
  if(e.key==='ArrowDown')keys.down=true;if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'){keys.up=false;jumpHeld=false;}
  if(e.key==='ArrowDown')keys.down=false;if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;
});

initGame();
requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);});
</script>
