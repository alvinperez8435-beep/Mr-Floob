<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mr Floob — Enhanced Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#050510;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;touch-action:none;
  font-family:'Press Start 2P',monospace;
}
#wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
#gameCanvas{
  display:block;border-radius:16px;
  box-shadow:0 0 60px #00ff6633, 0 0 120px #00ff6611;
  border:2px solid #1a3a1a;
}
#dpad{
  display:grid;
  grid-template-columns:64px 64px 64px;
  grid-template-rows:64px 64px;
  gap:6px;
}
.btn{
  background:linear-gradient(145deg,#0f1f0f,#1a2e1a);
  border:2px solid #2a4a2a;border-radius:14px;
  color:#50e878;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  box-shadow:0 5px 0 #050f05, 0 0 12px #00ff6611;
  transition:transform 0.08s,box-shadow 0.08s,background 0.08s;
  position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:radial-gradient(circle at 50% 0%,#50e87820,transparent 70%);
  pointer-events:none;
}
.btn.pressed,.btn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #050f05, 0 0 20px #50e87844;
  background:linear-gradient(145deg,#1a3a1a,#254025);
}
#btnUp{grid-column:2;grid-row:1;}
#btnLeft{grid-column:1;grid-row:2;}
#btnDown{grid-column:2;grid-row:2;}
#btnRight{grid-column:3;grid-row:2;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="dpad">
    <div class="btn" id="btnUp">▲</div>
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnDown">▼</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
</div>
<script>
// ═══════════════════════════════════════════════════════
//  MR FLOOB — ENHANCED EDITION
// ═══════════════════════════════════════════════════════

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

const isMobile = window.innerWidth < 640;
const CW = Math.min(window.innerWidth - 12, 560);
const CH = isMobile ? 230 : 290;
canvas.width  = CW;
canvas.height = CH;

const GY      = CH - 60;   // ground y
const DINO_X  = 90;
const G       = 1400;      // gravity px/s²
const JUMP_V  = -520;      // jump velocity px/s
const JUMP_HOLD_BONUS = -260; // extra if holding

// ─── Customization ──────────────────────────────────────
const SKINS = [
  '#50e878','#ff5555','#5599ff','#ffd700',
  '#ff55cc','#55ddee','#ff9944','#bb55ff',
  '#eeeeee','#999999'
];
const HATS      = ['none','party','crown','tophat'];
const HAT_NAMES = ['NONE','PARTY','CROWN','TOP'];

let skinIdx = 0;
let hatIdx  = 0;

// ─── Screens ────────────────────────────────────────────
// 'menu' | 'fade_in' | 'game' | 'gameover'
let SCREEN = 'menu';
let fadeAlpha = 1;

// ─── Stars & shooting stars ─────────────────────────────
const STARS = Array.from({length:80}, () => ({
  x: Math.random()*CW, y: Math.random()*(GY-10),
  r: Math.random()*1.8+0.3,
  phase: Math.random()*Math.PI*2,
  speed: 0.4+Math.random()*1.2
}));
let shootingStars = [];
let shootTimer = 0;

// ─── Parallax layers ────────────────────────────────────
// Mountains (far), hills (mid), ground details (near)
const MOUNTAINS = Array.from({length:6}, (_,i) => ({
  x: i*(CW/3), w:CW/3+40,
  h: 40+Math.random()*50,
  speed:0.3
}));
const HILLS = Array.from({length:8}, (_,i) => ({
  x: i*(CW/4), w:CW/4+30,
  h: 20+Math.random()*30,
  speed:0.7
}));
// Ground detail dots
const GROUND_DETAILS = Array.from({length:20}, () => ({
  x: Math.random()*CW, y: GY+8+Math.random()*15,
  w: 4+Math.random()*12, h: 3+Math.random()*5,
  speed: 1
}));

// ─── Clouds ─────────────────────────────────────────────
let clouds = Array.from({length:5}, makeCloud);

function makeCloud() {
  return {
    x: CW + Math.random()*400,
    y: 15 + Math.random()*(GY/2-20),
    rx: 35+Math.random()*60, ry:12+Math.random()*18,
    speed: 0.4+Math.random()*0.6, alpha:0.12+Math.random()*0.18
  };
}

// ─── Game state ──────────────────────────────────────────
let dino, obstacles, particles, dustTrail;
let score, displayScore, hiScore=0, speed, baseSpeed;
let obsTimer, obsInterval, gameOver, started;
let shakeX=0, shakeY=0, shakeTimer=0;
let jumpHeld=false, jumpTime=0;
let milestoneFlash=0;
let goScoreAnim=0, goTargetScore=0;

// ─── Input ───────────────────────────────────────────────
const keys = {up:false,down:false,left:false,right:false};
let menuZones = [];

// ─── Init game ───────────────────────────────────────────
function initGame() {
  dino = {
    y: GY-56, vy:0, ducking:false,
    onGround:true, w:40, h:56,
    glowPulse:0
  };
  obstacles=[]; particles=[]; dustTrail=[];
  score=0; displayScore=0;
  speed=5; baseSpeed=5;
  obsTimer=0; obsInterval=85;
  gameOver=false; started=false;
  shakeTimer=0; shakeX=0; shakeY=0;
  milestoneFlash=0;
}

// ─── Particles ───────────────────────────────────────────
function emit(x,y,count,vxRange,vyRange,color,life,size) {
  for(let i=0;i<count;i++) {
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*vxRange,
      vy:-Math.random()*vyRange,
      color: color||SKINS[skinIdx],
      life:1, maxLife:life||1,
      r:(size||3)+Math.random()*3,
      gravity:200+Math.random()*200
    });
  }
}

function emitDust(x,y) {
  dustTrail.push({
    x,y:y+4,
    vx:-30-Math.random()*40,
    vy:-20-Math.random()*30,
    life:1, r:3+Math.random()*4,
    alpha:0.5
  });
}

// ─── Obstacle factory ────────────────────────────────────
function makeObs() {
  const types=[
    {w:20,h:54,yOff:0,  kind:'cactus'},
    {w:36,h:30,yOff:0,  kind:'rock'},
    {w:50,h:24,yOff:-52,kind:'bird'},
  ];
  const t=types[Math.floor(Math.random()*types.length)];
  return {
    x:CW+30, y:GY-t.h+t.yOff,
    w:t.w, h:t.h, kind:t.kind,
    scaleIn:0   // entry animation 0→1
  };
}

// ═══════════════════════════════════════════════════════
//  DRAWING UTILS
// ═══════════════════════════════════════════════════════
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

// ─── Sky gradient (shifts with score) ───────────────────
function drawSky() {
  const t = Math.min(score/2000, 1);
  // night → twilight → alien
  const skyColors = [
    ['#050510','#0a0a20'],  // night
    ['#0a0520','#1a0530'],  // deep purple
    ['#050a1a','#001a10'],  // alien green night
  ];
  const idx = Math.floor(t*2);
  const frac = (t*2)-idx;
  const i0 = Math.min(idx, skyColors.length-1);
  const i1 = Math.min(idx+1, skyColors.length-1);

  const grad = ctx.createLinearGradient(0,0,0,GY);
  grad.addColorStop(0, skyColors[i0][0]);
  grad.addColorStop(1, skyColors[i0][1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,CW,GY);
}

// ─── Stars ───────────────────────────────────────────────
function drawStars(dt) {
  const t = performance.now()/1000;
  STARS.forEach((s,i) => {
    const a = 0.25+0.45*Math.abs(Math.sin(t*s.speed+s.phase));
    ctx.fillStyle = `rgba(200,210,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });

  // Shooting stars
  shootTimer -= dt;
  if(shootTimer<=0) {
    shootTimer = 4+Math.random()*8;
    shootingStars.push({
      x:Math.random()*CW, y:Math.random()*(GY/3),
      vx:-300-Math.random()*200, vy:80+Math.random()*80,
      life:1, len:60+Math.random()*80
    });
  }
  shootingStars.forEach(s=>{
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt*1.5;
    if(s.life<=0) return;
    const grad=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*0.15,s.y-s.vy*0.15);
    grad.addColorStop(0,`rgba(255,255,255,${s.life})`);
    grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=grad; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x-s.vx*0.15,s.y-s.vy*0.15); ctx.stroke();
  });
  shootingStars=shootingStars.filter(s=>s.life>0&&s.x>-200&&s.y<GY);
}

// ─── Parallax bg ─────────────────────────────────────────
function drawParallax(dt, spd) {
  // Mountains
  ctx.fillStyle='rgba(20,15,40,0.9)';
  MOUNTAINS.forEach(m=>{
    m.x -= m.speed * spd * dt * 60;
    if(m.x+m.w < 0) { m.x = CW+10; m.h=40+Math.random()*50; }
    ctx.beginPath();
    ctx.moveTo(m.x,GY-5);
    ctx.lineTo(m.x+m.w/2, GY-5-m.h);
    ctx.lineTo(m.x+m.w, GY-5);
    ctx.closePath(); ctx.fill();
  });
  // Hills
  ctx.fillStyle='rgba(10,25,15,0.8)';
  HILLS.forEach(h=>{
    h.x -= h.speed * spd * dt * 60;
    if(h.x+h.w < 0) { h.x=CW+10; h.h=20+Math.random()*30; }
    ctx.beginPath();
    ctx.ellipse(h.x+h.w/2, GY-3, h.w/2, h.h, 0, Math.PI, 0);
    ctx.fill();
  });
}

// ─── Ground ───────────────────────────────────────────────
function drawGround(dt, spd) {
  // Main ground line
  const grad=ctx.createLinearGradient(0,GY,0,CH);
  grad.addColorStop(0,'#20c048');
  grad.addColorStop(0.05,'#0d7a28');
  grad.addColorStop(1,'#051505');
  ctx.fillStyle=grad;
  ctx.fillRect(0,GY,CW,CH-GY);

  // Scrolling detail marks
  GROUND_DETAILS.forEach(d=>{
    d.x -= d.speed * spd * dt * 60;
    if(d.x+d.w<0) { d.x=CW+10; d.y=GY+8+Math.random()*15; d.w=4+Math.random()*12; }
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.fillRect(d.x,d.y,d.w,d.h);
  });

  // Ground glow line
  const gGrad=ctx.createLinearGradient(0,GY-2,0,GY+4);
  gGrad.addColorStop(0,'#40ff80');
  gGrad.addColorStop(1,'transparent');
  ctx.fillStyle=gGrad;
  ctx.fillRect(0,GY-2,CW,6);
}

// ─── Clouds ───────────────────────────────────────────────
function drawClouds(dt, spd) {
  clouds.forEach(c=>{
    c.x -= c.speed * spd * dt * 60;
    if(c.x+c.rx*2<0){Object.assign(c,makeCloud());c.x=CW+40;}
    ctx.fillStyle=`rgba(30,50,40,${c.alpha})`;
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.rx,c.ry,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x-c.rx*0.4,c.y+c.ry*0.2,c.rx*0.65,c.ry*0.75,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x+c.rx*0.4,c.y+c.ry*0.2,c.rx*0.55,c.ry*0.7,0,0,Math.PI*2);
    ctx.fill();
  });
}

// ─── Hat drawing ──────────────────────────────────────────
function drawHat(hat,cx,ty,s){
  s=s||1;
  if(hat==='party'){
    ctx.fillStyle='#ff3377';
    ctx.beginPath();
    ctx.moveTo(cx,ty-24*s);ctx.lineTo(cx-11*s,ty);ctx.lineTo(cx+11*s,ty);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#ffdd00';ctx.lineWidth=2*s;
    ctx.beginPath();ctx.moveTo(cx-6*s,ty-12*s);ctx.lineTo(cx+6*s,ty-12*s);ctx.stroke();
    ctx.fillStyle='#ffdd00';
    ctx.beginPath();ctx.arc(cx,ty-25*s,4*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#cc1155';ctx.fillRect(cx-13*s,ty-4*s,26*s,5*s);
  } else if(hat==='crown'){
    ctx.fillStyle='#ffd700';ctx.fillRect(cx-13*s,ty-9*s,26*s,9*s);
    ctx.beginPath();
    ctx.moveTo(cx-13*s,ty-9*s);ctx.lineTo(cx-9*s,ty-20*s);
    ctx.lineTo(cx-3*s,ty-11*s);ctx.lineTo(cx,ty-22*s);
    ctx.lineTo(cx+3*s,ty-11*s);ctx.lineTo(cx+9*s,ty-20*s);
    ctx.lineTo(cx+13*s,ty-9*s);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff2244';ctx.beginPath();ctx.arc(cx,ty-13*s,3.5*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4466ff';
    ctx.beginPath();ctx.arc(cx-9*s,ty-5*s,2.5*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+9*s,ty-5*s,2.5*s,0,Math.PI*2);ctx.fill();
  } else if(hat==='tophat'){
    ctx.fillStyle='#111';
    ctx.fillRect(cx-15*s,ty-5*s,30*s,6*s);
    ctx.fillRect(cx-10*s,ty-24*s,20*s,19*s);
    ctx.fillStyle='#7a3a10';ctx.fillRect(cx-10*s,ty-8*s,20*s,3*s);
    // shine
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.fillRect(cx-7*s,ty-22*s,4*s,10*s);
  }
}

// ─── Dino drawing ─────────────────────────────────────────
function drawDinoAt(dx,dy,ducking,color,hat,s,glowAmt){
  s=s||1;
  const dw=ducking?56*s:40*s;
  const dh=ducking?30*s:56*s;
  const rx=ducking?dx:dx;
  const ry=ducking?GY-dh:dy;

  // Glow
  if(glowAmt>0){
    ctx.save();
    ctx.shadowColor=color;
    ctx.shadowBlur=18*glowAmt;
    ctx.fillStyle=color;
    rr(rx,ry,dw,dh,7*s);ctx.fill();
    ctx.restore();
  }

  ctx.fillStyle=color;
  rr(rx,ry,dw,dh,7*s);ctx.fill();

  if(!ducking){
    // Eye white
    ctx.fillStyle='#0a0a12';
    ctx.beginPath();ctx.arc(rx+dw-9*s,ry+11*s,6*s,0,Math.PI*2);ctx.fill();
    // Eye shine
    ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(rx+dw-7*s,ry+9*s,2.5*s,0,Math.PI*2);ctx.fill();

    // Belly lighter
    ctx.fillStyle=lighten(color,0.15);
    rr(rx+4*s,ry+dh*0.35,dw-16*s,dh*0.45,4*s);ctx.fill();

    // Legs
    const t=performance.now();
    const l1=9*s+7*s*Math.abs(Math.sin(t/110));
    const l2=9*s+7*s*Math.abs(Math.cos(t/110));
    ctx.fillStyle=color;
    rr(rx+6*s,ry+dh,10*s,l1,3*s);ctx.fill();
    rr(rx+22*s,ry+dh,10*s,l2,3*s);ctx.fill();
    // Feet
    ctx.fillStyle=darken(color,0.15);
    rr(rx+4*s,ry+dh+l1-4*s,14*s,5*s,2*s);ctx.fill();
    rr(rx+20*s,ry+dh+l2-4*s,14*s,5*s,2*s);ctx.fill();
    // Arm
    ctx.fillStyle=color;
    rr(rx+dw,ry+20*s,12*s,7*s,3*s);ctx.fill();

    // Hat
    if(hat!=='none') drawHat(hat,rx+dw/2,ry,s);
  } else {
    // Duck eye
    ctx.fillStyle='#0a0a12';
    ctx.beginPath();ctx.arc(rx+dw-9*s,ry+10*s,5*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(rx+dw-7*s,ry+8*s,2*s,0,Math.PI*2);ctx.fill();
  }
}

function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16);
  let g=parseInt(hex.slice(3,5),16);
  let b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+Math.round(255*amt));
  g=Math.min(255,g+Math.round(255*amt));
  b=Math.min(255,b+Math.round(255*amt));
  return `rgb(${r},${g},${b})`;
}
function darken(hex,amt){
  let r=parseInt(hex.slice(1,3),16);
  let g=parseInt(hex.slice(3,5),16);
  let b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,r-Math.round(255*amt));
  g=Math.max(0,g-Math.round(255*amt));
  b=Math.max(0,b-Math.round(255*amt));
  return `rgb(${r},${g},${b})`;
}

// ─── Obstacle drawing ─────────────────────────────────────
function drawObstacle(o){
  const sc=Math.min(o.scaleIn,1);
  ctx.save();
  ctx.translate(o.x+o.w/2, o.y+o.h/2);
  ctx.scale(sc,sc);
  ctx.translate(-(o.w/2),-(o.h/2));

  if(o.kind==='cactus'){
    const cg=ctx.createLinearGradient(0,0,0,o.h);
    cg.addColorStop(0,'#ff6060');cg.addColorStop(1,'#aa2020');
    ctx.fillStyle=cg;
    rr(0,0,o.w,o.h,4);ctx.fill();
    rr(-10,10,10,18,3);ctx.fill();
    rr(o.w,16,10,14,3);ctx.fill();
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(o.w/2,o.h+4,o.w*0.6,4,0,0,Math.PI*2);ctx.fill();
  } else if(o.kind==='rock'){
    const rg=ctx.createRadialGradient(o.w*0.35,o.h*0.3,2,o.w/2,o.h/2,o.w/2);
    rg.addColorStop(0,'#cc4444');rg.addColorStop(1,'#771515');
    ctx.fillStyle=rg;
    ctx.beginPath();
    ctx.ellipse(o.w/2,o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
    // Shine
    ctx.fillStyle='rgba(255,100,100,0.25)';
    ctx.beginPath();
    ctx.ellipse(o.w*0.35,o.h*0.3,o.w*0.2,o.h*0.15,0,0,Math.PI*2);ctx.fill();
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(o.w/2,o.h+4,o.w*0.55,4,0,0,Math.PI*2);ctx.fill();
  } else {
    const flap=Math.floor(performance.now()/180)%2;
    ctx.fillStyle='#ffaa10';
    rr(0,0,o.w,o.h,6);ctx.fill();
    // Wing
    ctx.fillStyle='#ffcc50';
    const wy=flap?-12:6;
    rr(6,wy,o.w-12,13,4);ctx.fill();
    // Eye
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(o.w-8,6,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(o.w-7,5,1.5,0,Math.PI*2);ctx.fill();
    // Warning triangle (above bird)
    if(o.x < CW-50 && o.x > CW-180) {
      ctx.fillStyle='rgba(255,80,0,0.7)';
      ctx.beginPath();
      ctx.moveTo(o.w/2,-18);ctx.lineTo(o.w/2-8,-6);ctx.lineTo(o.w/2+8,-6);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold 8px monospace';
      ctx.textAlign='center';
      ctx.fillText('!',o.w/2,-10);
    }
  }
  ctx.restore();
}

// ─── Particles ────────────────────────────────────────────
function updateDrawParticles(dt){
  particles.forEach(p=>{
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=p.gravity*dt;
    p.life-=dt/p.maxLife;
    const a=Math.max(0,p.life);
    ctx.fillStyle=p.color.startsWith('rgb')?
      p.color.replace(')',`,${a})`).replace('rgb','rgba'):
      `rgba(${hexToRgb(p.color)},${a})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2);ctx.fill();
  });
  particles=particles.filter(p=>p.life>0);

  dustTrail.forEach(d=>{
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=150*dt;
    d.life-=dt*2; d.r+=dt*8;
    ctx.fillStyle=`rgba(50,200,80,${Math.max(0,d.life)*0.3})`;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
  });
  dustTrail=dustTrail.filter(d=>d.life>0);
}

// ─── HUD ─────────────────────────────────────────────────
function drawHUD(){
  const color=SKINS[skinIdx];
  const fs=isMobile?9:11;
  ctx.font=`${fs}px 'Press Start 2P'`;

  // Score (pulse on milestone)
  const pulse=milestoneFlash>0?1+milestoneFlash*0.3:1;
  ctx.save();
  const sx=CW-(isMobile?148:180), sy=20;
  ctx.translate(sx,sy);ctx.scale(pulse,pulse);ctx.translate(-sx,-sy);
  ctx.fillStyle=milestoneFlash>0?'#ffffff':color;
  ctx.fillText(`SCORE ${String(Math.floor(displayScore)).padStart(6,'0')}`,sx,sy);
  ctx.restore();

  ctx.fillStyle='#2a7a40';
  ctx.fillText(`BEST  ${String(hiScore).padStart(6,'0')}`,CW-(isMobile?148:180),sy+18);

  // Speed bar
  const barX=10, barY=10, barW=isMobile?70:90, barH=isMobile?8:10;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  rr(barX,barY,barW,barH,3);ctx.fill();
  const spPct=Math.min((speed-4)/8,1);
  const spGrad=ctx.createLinearGradient(barX,0,barX+barW,0);
  spGrad.addColorStop(0,'#20e050');spGrad.addColorStop(1,'#ff4444');
  ctx.fillStyle=spGrad;
  rr(barX,barY,barW*spPct,barH,3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.font=`${isMobile?6:7}px 'Press Start 2P'`;
  ctx.fillText('SPD',barX,barY+barH+10);
}

// ─── Collision ────────────────────────────────────────────
function dinoRect(){
  if(dino.ducking) return {x:DINO_X,y:GY-30,w:56,h:30};
  return {x:DINO_X,y:dino.y,w:dino.w,h:dino.h};
}
function collides(a,b){
  const p=7;
  return a.x+p<b.x+b.w-p&&a.x+a.w-p>b.x+p&&a.y+p<b.y+b.h-p&&a.y+a.h-p>b.y+p;
}

// ─── Menu tap zones ───────────────────────────────────────
function addZone(x,y,w,h,fn){ menuZones.push({x,y,w,h,fn}); }
function handleTap(px,py){
  for(const z of menuZones) if(px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h){z.fn();return;}
}

// ═══════════════════════════════════════════════════════
//  MENU
// ═══════════════════════════════════════════════════════
function drawMenu(dt){
  menuZones=[];
  ctx.fillStyle='#050510';ctx.fillRect(0,0,CW,CH);
  drawSky();
  drawStars(dt);
  drawParallax(dt,0.5);
  drawClouds(dt,0.5);
  drawGround(dt,0.5);

  // Title bounce+glow
  const t=performance.now()/1000;
  const bounce=Math.sin(t*2)*4;
  const glow=0.6+0.4*Math.sin(t*3);

  ctx.save();
  ctx.shadowColor=SKINS[skinIdx];
  ctx.shadowBlur=30*glow;
  ctx.fillStyle='#50e878';
  ctx.font=`${isMobile?16:22}px 'Press Start 2P'`;
  ctx.textAlign='center';
  ctx.fillText('MR FLOOB',CW/2,isMobile?34+bounce:44+bounce);
  ctx.restore();

  // Subtitle
  ctx.fillStyle='rgba(80,232,120,0.5)';
  ctx.font=`${isMobile?5:6}px 'Press Start 2P'`;
  ctx.fillText('ENHANCED EDITION',CW/2,isMobile?46:58);

  const fs=isMobile?7:9;

  // ── Hat section ─────────────────────────────────────
  ctx.fillStyle='#88cc88';
  ctx.font=`${fs}px 'Press Start 2P'`;
  ctx.fillText('CHOOSE HAT',CW/2,isMobile?60:76);

  const s=isMobile?0.52:0.65;
  const hatY=isMobile?100:122;
  const spacing=CW/(HATS.length+1);

  for(let i=0;i<HATS.length;i++){
    const hx=spacing*(i+1);
    const sel=(i===hatIdx);
    const bw=isMobile?44:54;
    const bh=70*s+20;
    const by=hatY-62*s-8;

    if(sel){
      // Glow highlight
      ctx.save();
      ctx.shadowColor=SKINS[skinIdx];
      ctx.shadowBlur=20;
      ctx.strokeStyle=SKINS[skinIdx];ctx.lineWidth=2;
      rr(hx-bw/2,by,bw,bh,8);ctx.stroke();
      ctx.restore();
      ctx.fillStyle='rgba(80,232,120,0.1)';
      rr(hx-bw/2,by,bw,bh,8);ctx.fill();
    } else {
      ctx.strokeStyle='#1a3a1a';ctx.lineWidth=1;
      rr(hx-bw/2,by,bw,bh,8);ctx.stroke();
    }

    // Idle bounce for selected dino preview
    const idleBounce=sel?Math.sin(t*3)*3:0;
    // temp dino state
    const pd={y:hatY-62*s+idleBounce,vy:0,ducking:false,onGround:true,w:40,h:56};
    ctx.save();
    ctx.translate(hx-20*s,0);
    drawDinoAt(0,hatY-62*s+idleBounce,false,SKINS[skinIdx],HATS[i],s,sel?0.6:0);
    ctx.restore();

    ctx.fillStyle=sel?SKINS[skinIdx]:'#446644';
    ctx.font=`${isMobile?6:7}px 'Press Start 2P'`;
    ctx.fillText(HAT_NAMES[i],hx,hatY+14);

    const idx=i;
    addZone(hx-bw/2,by,bw,bh+10,()=>{hatIdx=idx;});
  }

  // ── Skin section ────────────────────────────────────
  const skinLY=isMobile?148:180;
  ctx.fillStyle='#88cc88';
  ctx.font=`${fs}px 'Press Start 2P'`;
  ctx.fillText('CHOOSE COLOR',CW/2,skinLY);

  const sw=isMobile?19:23, sg=isMobile?4:5;
  const totalW=SKINS.length*(sw+sg)-sg;
  const sx0=(CW-totalW)/2;
  const swY=skinLY+13;

  for(let i=0;i<SKINS.length;i++){
    const sx=sx0+i*(sw+sg);
    // Glow on selected
    if(i===skinIdx){
      ctx.save();
      ctx.shadowColor=SKINS[i];ctx.shadowBlur=16;
      ctx.fillStyle=SKINS[i];
      rr(sx,swY,sw,sw,5);ctx.fill();
      ctx.restore();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;
      rr(sx-2,swY-2,sw+4,sw+4,6);ctx.stroke();
    } else {
      ctx.fillStyle=SKINS[i];
      rr(sx,swY,sw,sw,5);ctx.fill();
    }
    const idx=i;
    addZone(sx-4,swY-4,sw+8,sw+8,()=>{skinIdx=idx;});
  }

  // ── Play button ────────────────────────────────────
  const btnY=isMobile?196:232;
  const btnW=isMobile?140:170, btnH=isMobile?30:36;
  const btnX=CW/2-btnW/2;
  const btnPulse=0.9+0.1*Math.sin(t*4);

  ctx.save();
  ctx.shadowColor='#50e878';ctx.shadowBlur=20*btnPulse;
  ctx.fillStyle=`rgba(40,180,80,${0.8+0.2*btnPulse})`;
  rr(btnX,btnY,btnW,btnH,10);ctx.fill();
  ctx.restore();

  // Button shine
  ctx.fillStyle='rgba(255,255,255,0.15)';
  rr(btnX+4,btnY+4,btnW-8,btnH/2-4,6);ctx.fill();

  ctx.fillStyle='#050510';
  ctx.font=`${isMobile?10:12}px 'Press Start 2P'`;
  ctx.fillText('▶  PLAY!',CW/2,btnY+btnH/2+4);
  addZone(btnX,btnY,btnW,btnH,()=>{
    SCREEN='fade_in';fadeAlpha=1;
    initGame();
  });

  ctx.textAlign='left';
}

// ═══════════════════════════════════════════════════════
//  GAME UPDATE
// ═══════════════════════════════════════════════════════
function updateGame(dt){
  if(!started||gameOver) return;

  score+=dt*100;
  // Smooth display score
  displayScore+=(score-displayScore)*Math.min(1,dt*8);

  // Milestone
  const prev=Math.floor((score-dt*100)/100);
  const curr=Math.floor(score/100);
  if(curr>prev&&curr>0){
    milestoneFlash=1;
    emit(DINO_X+20,dino.y,20,200,300,SKINS[skinIdx],1.2,4);
  }
  if(milestoneFlash>0) milestoneFlash=Math.max(0,milestoneFlash-dt*3);

  // Dino physics (delta-time based)
  dino.glowPulse=0.3+0.3*Math.abs(Math.sin(performance.now()/400));

  if(!dino.onGround){
    // Hold jump for extra height
    if(keys.up&&jumpHeld&&(performance.now()-jumpTime)<200){
      dino.vy+=JUMP_HOLD_BONUS*dt;
    }
    dino.vy+=G*dt;
    dino.y+=dino.vy*dt;
    if(dino.y>=GY-dino.h){
      dino.y=GY-dino.h; dino.vy=0; dino.onGround=true;
      // Landing dust
      emit(DINO_X+10,GY,6,80,60,'rgba(50,200,80,0.8)',0.5,3);
    }
  }

  // Duck
  if(keys.down&&dino.onGround) dino.ducking=true;
  else if(!keys.down) dino.ducking=false;

  // Speed
  if(keys.right) speed=Math.min(baseSpeed+6,speed+0.12);
  else if(keys.left) speed=Math.max(2.5,speed-0.1);
  else {
    const diff=baseSpeed-speed;
    speed+=diff*Math.min(1,dt*4);
  }
  baseSpeed=5+score/800;

  // Dust trail when running
  if(dino.onGround&&!dino.ducking&&Math.random()<0.3){
    emitDust(DINO_X+6,GY);
  }

  // Spawn obstacles
  obsTimer+=dt*60;
  if(obsTimer>=obsInterval){
    obstacles.push(makeObs());
    obsTimer=0;
    obsInterval=52+Math.random()*55;
  }

  // Update obstacles
  obstacles.forEach(o=>{
    o.x-=speed*dt*60;
    o.scaleIn=Math.min(1,o.scaleIn+dt*6);
  });
  obstacles=obstacles.filter(o=>o.x+o.w>0);

  // Collision
  const dr=dinoRect();
  for(const o of obstacles){
    if(collides(dr,o)){
      gameOver=true;
      hiScore=Math.max(hiScore,Math.floor(score));
      goTargetScore=Math.floor(score);
      goScoreAnim=0;
      // Big death burst
      emit(DINO_X+20,dino.y+20,30,300,400,SKINS[skinIdx],1.5,5);
      emit(DINO_X+20,dino.y+20,15,200,300,'#ffffff',1,3);
      // Screen shake
      shakeTimer=0.5;
      return;
    }
  }

  // Screen shake
  if(shakeTimer>0){
    shakeTimer=Math.max(0,shakeTimer-dt);
    shakeX=(Math.random()-0.5)*10*shakeTimer;
    shakeY=(Math.random()-0.5)*8*shakeTimer;
  } else { shakeX=0; shakeY=0; }

  // Clouds
  clouds.forEach(c=>{
    c.x-=c.speed*(speed/5)*dt*60;
    if(c.x+c.rx*2<0){Object.assign(c,makeCloud());c.x=CW+40;}
  });
}

// ═══════════════════════════════════════════════════════
//  GAME DRAW
// ═══════════════════════════════════════════════════════
function drawGame(dt){
  menuZones=[];
  ctx.fillStyle='#050510';ctx.fillRect(0,0,CW,CH);
  drawSky();
  drawStars(dt);
  drawParallax(dt,speed/5);

  ctx.save();
  ctx.translate(shakeX,shakeY);

  drawClouds(dt,speed/5);
  drawGround(dt,speed/5);
  obstacles.forEach(drawObstacle);

  // Dino
  drawDinoAt(
    DINO_X,
    dino.ducking?GY-30:Math.round(dino.y),
    dino.ducking,
    SKINS[skinIdx],
    HATS[hatIdx],
    1,
    dino.glowPulse
  );

  updateDrawParticles(dt);
  ctx.restore();

  drawHUD();

  if(!started){
    ctx.fillStyle='rgba(5,5,16,0.55)';ctx.fillRect(0,0,CW,CH);
    ctx.textAlign='center';
    ctx.save();
    ctx.shadowColor=SKINS[skinIdx];ctx.shadowBlur=30;
    ctx.fillStyle=SKINS[skinIdx];
    ctx.font=`${isMobile?15:20}px 'Press Start 2P'`;
    ctx.fillText('MR FLOOB',CW/2,CH/2-30);
    ctx.restore();
    ctx.fillStyle='rgba(170,255,170,0.85)';
    ctx.font=`${isMobile?8:10}px 'Press Start 2P'`;
    ctx.fillText('TAP  ▲  TO  START',CW/2,CH/2+4);
    ctx.textAlign='left';
  }

  if(gameOver){
    // Animate game over score count-up
    goScoreAnim=Math.min(goTargetScore,goScoreAnim+goTargetScore*dt*2);

    ctx.fillStyle='rgba(5,5,16,0.75)';ctx.fillRect(0,0,CW,CH);
    ctx.textAlign='center';

    ctx.save();
    ctx.shadowColor='#ff4040';ctx.shadowBlur=30;
    ctx.fillStyle='#ff4040';
    ctx.font=`${isMobile?15:20}px 'Press Start 2P'`;
    ctx.fillText('GAME OVER',CW/2,CH/2-42);
    ctx.restore();

    ctx.fillStyle='#fff';
    ctx.font=`${isMobile?9:11}px 'Press Start 2P'`;
    ctx.fillText(`SCORE: ${String(Math.floor(goScoreAnim)).padStart(6,'0')}`,CW/2,CH/2-14);

    if(Math.floor(score)>=hiScore&&Math.floor(score)>0){
      ctx.fillStyle='#ffd700';
      ctx.font=`${isMobile?7:8}px 'Press Start 2P'`;
      ctx.fillText('✦ NEW BEST! ✦',CW/2,CH/2+4);
    } else {
      ctx.fillStyle='#50e878';
      ctx.font=`${isMobile?8:10}px 'Press Start 2P'`;
      ctx.fillText(`BEST: ${hiScore}`,CW/2,CH/2+4);
    }

    // Restart button
    const rbW=isMobile?130:155, rbH=isMobile?28:34;
    const rbX=CW/2-rbW/2, rbY=CH/2+20;
    ctx.save();
    ctx.shadowColor='#50e878';ctx.shadowBlur=15;
    ctx.fillStyle='#28c050';
    rr(rbX,rbY,rbW,rbH,8);ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.15)';
    rr(rbX+4,rbY+4,rbW-8,rbH/2-4,5);ctx.fill();
    ctx.fillStyle='#050510';
    ctx.font=`${isMobile?9:10}px 'Press Start 2P'`;
    ctx.fillText('RESTART',CW/2,rbY+rbH/2+4);
    addZone(rbX,rbY,rbW,rbH,()=>{
      initGame();started=true;
      dino.vy=JUMP_V;dino.onGround=false;jumpHeld=true;jumpTime=performance.now();
    });

    // Main menu button
    const mbW=isMobile?150:180, mbH=isMobile?28:34;
    const mbX=CW/2-mbW/2, mbY=rbY+rbH+8;
    ctx.save();
    ctx.shadowColor='#3060ff';ctx.shadowBlur=12;
    ctx.fillStyle='#1a3ab0';
    rr(mbX,mbY,mbW,mbH,8);ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.1)';
    rr(mbX+4,mbY+4,mbW-8,mbH/2-4,5);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font=`${isMobile?9:10}px 'Press Start 2P'`;
    ctx.fillText('MAIN MENU',CW/2,mbY+mbH/2+4);
    addZone(mbX,mbY,mbW,mbH,()=>{SCREEN='menu';clouds=Array.from({length:5},makeCloud);});

    ctx.textAlign='left';
  }
}

// ═══════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════
let lastTime=0;
function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;

  if(SCREEN==='menu'){
    drawMenu(dt);
  } else if(SCREEN==='fade_in'){
    updateGame(dt);
    drawGame(dt);
    fadeAlpha=Math.max(0,fadeAlpha-dt*3);
    ctx.fillStyle=`rgba(5,5,16,${fadeAlpha})`;
    ctx.fillRect(0,0,CW,CH);
    if(fadeAlpha<=0) SCREEN='game';
  } else {
    updateGame(dt);
    drawGame(dt);
  }
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════
function getTap(e,touch){
  const r=canvas.getBoundingClientRect();
  const src=touch?e.changedTouches[0]:e;
  return{x:(src.clientX-r.left)*(CW/r.width),y:(src.clientY-r.top)*(CH/r.height)};
}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const p=getTap(e,true);
  handleTap(p.x,p.y);
},{passive:false});
canvas.addEventListener('click',e=>{
  const p=getTap(e,false);
  handleTap(p.x,p.y);
});

function setupBtn(id,key){
  const el=document.getElementById(id);
  const press=e=>{
    e.preventDefault();keys[key]=true;
    el.classList.add('pressed');
    if(key==='up'&&SCREEN==='game'){
      if(!started){started=true;return;}
      if(!gameOver&&dino.onGround){
        dino.vy=JUMP_V;dino.onGround=false;
        jumpHeld=true;jumpTime=performance.now();
        // Jump flash
        emit(DINO_X+20,GY,8,100,150,SKINS[skinIdx],0.4,3);
      }
    }
  };
  const release=e=>{
    e.preventDefault();keys[key]=false;
    el.classList.remove('pressed');
    if(key==='up') jumpHeld=false;
  };
  el.addEventListener('touchstart',press,{passive:false});
  el.addEventListener('touchend',release,{passive:false});
  el.addEventListener('mousedown',press);
  el.addEventListener('mouseup',release);
  el.addEventListener('mouseleave',release);
}
setupBtn('btnUp','up');
setupBtn('btnDown','down');
setupBtn('btnLeft','left');
setupBtn('btnRight','right');

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){
    if(!keys.up){
      keys.up=true;
      if(SCREEN==='game'){
        if(!started){started=true;return;}
        if(!gameOver&&dino.onGround){
          dino.vy=JUMP_V;dino.onGround=false;
          jumpHeld=true;jumpTime=performance.now();
          emit(DINO_X+20,GY,8,100,150,SKINS[skinIdx],0.4,3);
        }
      }
    }
  }
  if(e.key==='ArrowDown') keys.down=true;
  if(e.key==='ArrowLeft') keys.left=true;
  if(e.key==='ArrowRight') keys.right=true;
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'){keys.up=false;jumpHeld=false;}
  if(e.key==='ArrowDown') keys.down=false;
  if(e.key==='ArrowLeft') keys.left=false;
  if(e.key==='ArrowRight') keys.right=false;
});

// ─── Boot ────────────────────────────────────────────────
initGame();
requestAnimationFrame(ts=>{lastTime=ts;requestAnimationFrame(loop);});
</script>
